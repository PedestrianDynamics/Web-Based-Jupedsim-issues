[project]
name = "jupedsim-web-community"
version = "0.1.0"
description = "Community resources, scenario scripting, and validation assets for JuPedSim Web"
requires-python = ">=3.11"
dependencies = [
    "ipykernel",
    "jupyter",
    "jupedsim",
    "jupedsim-scenarios>=0.6.4",
    "numpy",
    "pandas",
    "pedpy",
    "shapely",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "standards/tests",
]
markers = [
    "vv: verification and validation tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Black-style formatting; applies to .py and .ipynb (Jupyter) alike.

[tool.ruff.lint]
# Start narrow: import sorting only. Pyflakes/pycodestyle rules produce
# cross-cell false positives on notebooks (e.g. a helper defined in one cell
# and used in another reads as F821); widen the rule set in a later pass once
# a clean baseline is in place.
select = ["I"]
