name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --extra dev

    # Formatting and import order, on .py and .ipynb alike. Config in
    # pyproject.toml ([tool.ruff]). Run pre-commit locally to auto-fix before
    # pushing; this job only checks.
    - name: ruff format --check
      run: uv run --extra dev ruff format --check .

    - name: ruff check
      run: uv run --extra dev ruff check .
