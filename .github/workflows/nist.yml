name: NIST Tests

on:
  push:
    branches: [main]
    paths:
      - "tests/vv/test_nist.py"
      - "tests/vv/vv_helpers.py"
      - "standards/nist/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/nist.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/vv/test_nist.py"
      - "tests/vv/vv_helpers.py"
      - "standards/nist/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/nist.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  nist-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Sync environment
      run: uv sync --extra dev

    - name: Run NIST tests
      run: uv run --extra dev python -m pytest tests/vv/test_nist.py -v --junitxml=results/nist-tests.xml

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nist-test-results
        path: results/nist-tests.xml

    - name: Test summary
      if: always()
      uses: test-summary/action@v2
      with:
        paths: results/nist-tests.xml
